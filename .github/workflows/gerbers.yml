# This is a basic workflow to help you get started with Actions

name: JLCPCB Exports

# Controls when the action will run.
on:
  # Run when any design files are changed
  push:
    paths:
      - "**.kicad_sch"
      - "**.kicad_pcb"
      - "**.kicad_pro"
      - ".github/workflows/jlc.yml"
    branches:
      - "main"
    tags:
      - "v*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  #jobs:
  fab_exports:
    name: "Fabrication Outputs"
    runs-on: ubuntu-latest
    # container: ghcr.io/kicad/kicad:9.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions-for-kicad/kicad-actions@v1.6-k9.0
        with:
          entrypoint: kicad-cli
          args: jobset run -f fab.kicad_jobset GeoMCU.kicad_pro

      - name: Artifacts Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Generic Files
          path: production
